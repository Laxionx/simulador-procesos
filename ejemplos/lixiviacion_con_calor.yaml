# Fase 2: la misma lixiviación del caso 2, ahora con balance de calor.
# Las alimentaciones entran a distinta temperatura; el reactor es adiabático (la disolución del
# CuO libera calor) y un calentador lleva la solución a 30 °C antes de la extracción por
# solventes. El ácido entra ya diluido (H2SO4 acuoso): el calor de dilución no se modela.
nombre: Lixiviación de óxidos de cobre con balance de calor
balance_de_calor: true
especies:
  - {nombre: CuO, fase: s}
  - {nombre: CaCO3, fase: s}
  - {nombre: SiO2, fase: s}
  - {nombre: H2SO4, fase: aq}
  - {nombre: H2O, fase: l}
  - {nombre: CuSO4, fase: aq}
  - {nombre: CaSO4, fase: s}
  - {nombre: CO2, fase: g}
alimentaciones:
  Mineral: {flujos: {CuO: 1500.0, CaCO3: 800.0, SiO2: 97700.0}, temperatura: 20}
  Acido: {flujos: {H2SO4: 3000.0}, temperatura: 25}
  Agua: {flujos: {H2O: 150000.0}, temperatura: 18}
equipos:
  - tipo: mezclador
    nombre: Acondicionamiento
    entradas: [Mineral, Acido, Agua]
    salidas: [Pulpa]
  - tipo: reactor
    nombre: Lixiviación
    entradas: [Pulpa]
    salidas: [Descarga]
    reacciones:
      - {ecuacion: "CuO + H2SO4 -> CuSO4 + H2O", clave: CuO, conversion: 0.90}
      - {ecuacion: "CaCO3 + H2SO4 -> CaSO4 + H2O + CO2", clave: CaCO3, conversion: 1.0}
  - tipo: calentador
    nombre: Calentador
    entradas: [Descarga]
    salidas: [PLS]
    temperatura: 30
controladores:
  - nombre: Acidez libre
    ajustar: {alimentacion: Acido, especie: H2SO4, minimo: 0, maximo: 20000}
    meta: {corriente: PLS, propiedad: g_por_kg_agua, especie: H2SO4, valor: 5}
