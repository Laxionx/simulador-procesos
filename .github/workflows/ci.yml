name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,equilibrio,molienda]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest con cobertura
        run: pytest --cov=procesos --cov-report=term-missing --cov-fail-under=90
      - name: Ejemplos por la línea de comandos
        run: |
          for f in ejemplos/*.yaml; do python -m procesos resolver "$f"; done
